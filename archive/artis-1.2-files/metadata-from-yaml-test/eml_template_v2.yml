# =============================================================================
# Ecological Metadata Language (EML) 2.2.0 — Native YAML Schema
# =============================================================================
# This file is written as if EML were designed natively in YAML.
# No @, #text, or ` translation artifacts — just clean, readable structure.
# Generated by Claude AI 2026-03-10
#
# Design conventions used throughout:
#   - XML attributes become sibling keys at the same level
#   - Namespaces declared once in the top-level `meta` block
#   - Repeatable elements are always written as lists (even if only one item)
#   - Mixed content (attribute + text value) uses a `value:` key
#   - Optional fields are shown with a comment: # [OPTIONAL]
#   - Repeatable fields are shown with a comment: # [REPEATABLE]
#   - Required fields are shown with a comment: # [REQUIRED]
# =============================================================================


# -----------------------------------------------------------------------------
# META — Schema declaration (replaces XML namespace attributes on root element)
# -----------------------------------------------------------------------------
meta:
  schema: https://eml.ecoinformatics.org/eml-2.2.0
  xsd: https://eml.ecoinformatics.org/eml-2.2.0/xsd/eml.xsd
  packageId: doi:10.xxxx/dataset.1        # [REQUIRED] Unique identifier
  system: https://doi.org                 # [REQUIRED] System managing packageId
  scope: system                           # [OPTIONAL] system | document
  language: en                            # [OPTIONAL] Default language for text


# -----------------------------------------------------------------------------
# ACCESS — Who can read or modify this metadata document
# -----------------------------------------------------------------------------
access:
  authSystem: https://pasta.lternet.edu/authentication
  order: allowFirst                       # allowFirst | denyFirst
  scope: document                         # document | system

  allow:                                  # [REPEATABLE]
    - principal: public
      permission: read                    # read | write | changePermission | all
    - principal: uid=data-manager,o=LTER,dc=ecoinformatics,dc=org
      permission: all

  deny:                                   # [OPTIONAL][REPEATABLE]
    - principal: uid=blocked-user,o=LTER,dc=ecoinformatics,dc=org
      permission: write


# -----------------------------------------------------------------------------
# DATASET — Primary resource module
# -----------------------------------------------------------------------------
dataset:
  id: dataset-001                         # [OPTIONAL] Local cross-reference ID
  system: knb                             # [OPTIONAL]
  scope: document                         # [OPTIONAL] document | system

  # -- Basic Identification --

  alternateIdentifiers:                   # [OPTIONAL][REPEATABLE]
    - value: doi:10.xxxx/alternate-id
      system: https://doi.org

  titles:                                 # [REQUIRED][REPEATABLE] One per language
    - value: Full Title of the Dataset
      language: en
    - value: Título completo del conjunto de datos
      language: es

  shortName: Short Dataset Name          # [OPTIONAL]


  # -- Creators (intellectual originators, receive citation credit) --

  creators:                               # [REQUIRED][REPEATABLE]
    - id: https://orcid.org/0000-0000-0000-0001
      individualName:
        salutation: Dr.                   # [OPTIONAL]
        givenNames:                       # [OPTIONAL][REPEATABLE]
          - Jane
        surName: Smith                    # [REQUIRED]
      organizationName: University of Ecology   # [OPTIONAL]
      positionName: Principal Investigator      # [OPTIONAL]
      address:                            # [OPTIONAL]
        deliveryPoints:                   # [OPTIONAL][REPEATABLE]
          - 123 Research Ave
        city: Ecologyville
        administrativeArea: CA
        postalCode: "90210"
        country: USA
      phones:                             # [OPTIONAL][REPEATABLE]
        - value: +1-555-555-1234
          type: voice                     # voice | fax
        - value: +1-555-555-5678
          type: fax
      emails:                             # [OPTIONAL][REPEATABLE]
        - jsmith@university.edu
      onlineUrls:                         # [OPTIONAL][REPEATABLE]
        - https://www.university.edu/jsmith
      userIds:                            # [OPTIONAL][REPEATABLE]
        - value: https://orcid.org/0000-0000-0000-0001
          directory: https://orcid.org


  # -- Metadata Provider --

  metadataProviders:                      # [OPTIONAL][REPEATABLE]
    - individualName:
        givenNames: [Data]
        surName: Manager
      organizationName: Data Management Office
      emails:
        - dm@university.edu


  # -- Associated Parties (contributors, no citation credit) --

  associatedParties:                      # [OPTIONAL][REPEATABLE]
    - individualName:
        givenNames: [Field]
        surName: Technician
      role: fieldStaff
      # Common roles: fieldStaff, labTechnician, principalInvestigator,
      # collaboratingPrincipalInvestigator, coPrincipalInvestigator,
      # custodianSteward, distributor, editor, funder, informationManager,
      # originator, owner, pointOfContact, processor, publisher, user


  # -- Dates --

  pubDate: "2024-06-15"                  # [OPTIONAL] YYYY, YYYY-MM, or YYYY-MM-DD


  # -- Language of the data itself --

  language: English                      # [OPTIONAL]


  # -- Series --

  series: Long-Term Ecological Research Series  # [OPTIONAL]


  # -- Abstract --

  abstract:                              # [OPTIONAL]
    paragraphs:
      - >
        This dataset documents long-term measurements of primary productivity
        and species richness across multiple ecosystems in the study region.
      - >
        Sampling occurred annually from 2000 to 2020 at 50 permanent plots.


  # -- Keywords --

  keywordSets:                           # [OPTIONAL][REPEATABLE]
    - keywords:
        - value: primary productivity
          type: theme                    # theme | place | stratum | temporal | taxonomic
        - value: species richness
          type: theme
        - value: Sierra Nevada
          type: place
        - value: long-term
          type: temporal
      thesaurus: LTER Controlled Vocabulary
    - keywords:
        - value: ecology
        - value: biodiversity
      thesaurus: None


  # -- Additional Info --

  additionalInfo:                        # [OPTIONAL]
    paragraphs:
      - Data were collected as part of NSF grant DEB-XXXXXXX.


  # -- Rights & Licensing --

  intellectualRights:                    # [OPTIONAL]
    paragraphs:
      - >
        This dataset is released under the Creative Commons Attribution 4.0
        International License (CC BY 4.0). Users must credit the original authors.

  licensed:                              # [OPTIONAL][REPEATABLE] EML 2.2.0+
    - licenseName: Creative Commons Attribution 4.0 International
      url: https://creativecommons.org/licenses/by/4.0/
      identifier: CC-BY-4.0


  # -- Distribution (where to access or download the data) --

  distributions:                         # [OPTIONAL][REPEATABLE]
    - id: dist-001
      online:
        url: https://data.repository.org/package/dataset-001
        urlFunction: download            # download | information
    - offline:
        mediumName: DVD
        mediumDensity: 4.7
        mediumDensityUnits: GB
        mediumVolume: 1 disc
        mediumFormat: ISO 9660
        mediumNote: Available upon request from the data manager.
    - inline: Raw small data can be embedded directly here as text.


  # ---------------------------------------------------------------------------
  # COVERAGE — Geographic, temporal, and taxonomic extent
  # ---------------------------------------------------------------------------
  coverage:

    geographic:                          # [OPTIONAL][REPEATABLE]
      - description: >
          Study area located in the Sierra Nevada foothills, California, USA,
          bounded by the American River to the north and Highway 50 to the south.
        boundingCoordinates:
          west: -121.5                   # Decimal degrees
          east: -120.0
          north: 39.0
          south: 38.0
          altitudes:                     # [OPTIONAL]
            minimum: 200
            maximum: 1800
            units: meter

    temporal:                            # [OPTIONAL][REPEATABLE]
      - rangeOfDates:
          begin: "2000-01-01"
          end: "2020-12-31"
      - singleDateTime:
          date: "2010-07-15"
          time: "14:30:00"

    taxonomic:                           # [OPTIONAL][REPEATABLE]
      - generalDescription: Vascular plants in the family Poaceae and Asteraceae.
        classification:
          rankName: Kingdom
          rankValue: Plantae
          children:
            - rankName: Phylum
              rankValue: Tracheophyta
              children:
                - rankName: Family
                  rankValue: Poaceae
                  children:
                    - rankName: Genus
                      rankValue: Bromus
                      taxonId:
                        value: "40351"
                        provider: https://www.itis.gov
                      children:
                        - rankName: Species
                          rankValue: Bromus tectorum
                          commonName: cheatgrass
                          taxonId:
                            value: "40352"
                            provider: https://www.itis.gov


  # -- Purpose --

  purpose:                               # [OPTIONAL]
    paragraphs:
      - >
        To monitor changes in plant community composition and productivity
        in response to climate variability over two decades.


  # -- Introduction / Getting Started / Acknowledgements (EML 2.2.0+) --

  introduction:                          # [OPTIONAL]
    paragraphs:
      - >
        This dataset is part of the ongoing regional ecosystem monitoring
        program. See the accompanying protocol document for full field methods.

  gettingStarted:                        # [OPTIONAL]
    paragraphs:
      - >
        Download the CSV files and the data dictionary. Use the R script
        provided in the supplemental materials to reproduce all analyses.

  acknowledgements:                      # [OPTIONAL]
    paragraphs:
      - >
        Funding provided by NSF Long-Term Ecological Research program
        (grant DEB-XXXXXXX). Field work assisted by student volunteers.


  # -- Maintenance --

  maintenance:                           # [OPTIONAL]
    description:
      paragraphs:
        - >
          Data are updated annually. New observations added each February
          following quality control review.
    updateFrequency: annually
    # Options: annually | asNeeded | biannually | continually | daily |
    #          irregular | monthly | notPlanned | unknown | weekly | otherMaintenancePeriod
    changeHistory:                       # [OPTIONAL][REPEATABLE]
      - scope: "dataTable: plot_data.csv"
        oldValue: Version 1.0
        changeDate: "2022-02-01"
        comment: Added 2021 observations; corrected GPS coordinates for plot 34.


  # -- Contact --

  contact:                               # [REQUIRED]
    individualName:
      givenNames: [Jane]
      surName: Smith
    emails:
      - jsmith@university.edu


  # -- Publisher --

  publisher:                             # [OPTIONAL]
    organizationName: Environmental Data Initiative
    onlineUrls:
      - https://edirepository.org


  # -- Publication Place --

  pubPlace: Albuquerque, NM             # [OPTIONAL]


  # ---------------------------------------------------------------------------
  # METHODS — How data were collected and processed
  # ---------------------------------------------------------------------------
  methods:

    methodSteps:                         # [REPEATABLE]
      - description:
          sections:
            - title: Field Sampling
              paragraphs:
                - >
                  Fifty 10×10 m permanent plots were established across the study
                  area using stratified random sampling. Plot corners were marked
                  with rebar and GPS coordinates recorded with sub-meter accuracy.
                - >
                  Within each plot, all vascular plant species were identified and
                  percent cover estimated in July of each year.
        instrumentation:               # [OPTIONAL][REPEATABLE]
          - Trimble GeoXH GPS unit (sub-meter accuracy)
          - Canon EOS R field camera
        software:                      # [OPTIONAL]
          title: R Statistical Software
          creator:
            organizationName: R Core Team
          version: 4.3.0

      - description:
          paragraphs:
            - >
              Biomass estimated from allometric equations derived from
              destructive harvests conducted in the first year of the study.
        dataSource:                    # [OPTIONAL] References another dataset used as input
          title: Reference allometric equations dataset
          creator:
            individualName:
              surName: Brown
          distributions:
            - online:
                url: https://data.repository.org/package/allometric-ref

    sampling:                          # [OPTIONAL]
      studyExtent:
        description:
          paragraphs:
            - >
              Sampling occurred at 50 permanent plots distributed across a 500 km²
              study area. Annual surveys conducted each July.
      samplingDescription:
        paragraphs:
          - >
            Plots selected using stratified random sampling across five elevation
            bands (200–400, 400–600, 600–900, 900–1200, 1200–1800 m).
            Ten plots per elevation band.
      spatialSamplingUnits:
        referencedEntityId: datatable-plots

    qualityControl:                    # [OPTIONAL]
      description:
        paragraphs:
          - >
            All species identifications verified by a botanist. Data entered
            twice and discrepancies resolved by field re-measurement where possible.
            Outlier values flagged using ±3 SD threshold and reviewed manually.


  # ---------------------------------------------------------------------------
  # PROJECT — Research project that generated the data
  # ---------------------------------------------------------------------------
  project:
    id: project-001
    title: Sierra Nevada Long-Term Ecosystem Monitoring Project
    personnel:                         # [REPEATABLE]
      - individualName:
          givenNames: [Jane]
          surName: Smith
        role: principalInvestigator
    abstract:
      paragraphs:
        - >
          A 20-year study of ecosystem dynamics in the Sierra Nevada foothills,
          focusing on plant community response to drought and warming.
    funding:
      paragraphs:
        - >
          National Science Foundation Long-Term Ecological Research Program,
          Award DEB-XXXXXXX ($1,200,000, 2000–2020).
    awards:                            # [OPTIONAL][REPEATABLE] EML 2.2.0+
      - funderName: National Science Foundation
        funderIdentifier: https://ror.org/021nxhr62
        awardNumber: DEB-XXXXXXX
        title: Sierra Nevada Ecosystem Monitoring
        awardUrl: https://www.nsf.gov/awardsearch/showAward?AWD_ID=XXXXXXX
    studyAreaDescription:              # [OPTIONAL]
      descriptors:
        - name: vegetation
          citableClassificationSystem: false
          value: Mixed oak woodland and chaparral shrubland
    designDescription:                 # [OPTIONAL]
      description:
        paragraphs:
          - >
            Stratified random design with permanent plots across five elevation
            zones. Annual re-measurement ensures temporal consistency.
    relatedProjects:                   # [OPTIONAL][REPEATABLE]
      - title: California Biodiversity Network
        personnel:
          - individualName:
              surName: Jones
            role: collaboratingPrincipalInvestigator


  # ---------------------------------------------------------------------------
  # DATA ENTITIES
  # Types: dataTable | spatialRaster | spatialVector | storedProcedure |
  #        view | otherEntity
  # ---------------------------------------------------------------------------

  # -- Data Table --

  dataTables:                          # [OPTIONAL][REPEATABLE]
    - id: datatable-plots
      entityName: plot_data.csv
      entityDescription: Annual vegetation measurements from 50 permanent plots, 2000–2020.
      physical:
        objectName: plot_data.csv
        size:
          value: 2048576
          unit: bytes
        authentication:
          value: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
          method: MD5
        dataFormat:
          textFormat:
            numHeaderLines: 1
            numFooterLines: 0
            recordDelimiter: "\\n"
            attributeOrientation: column   # column | row
            simpleDelimited:
              fieldDelimiter: ","
              quoteCharacter: '"'
              literalCharacter: "\\"
        distributions:
          - online:
              url: https://data.repository.org/package/dataset-001/plot_data.csv
              urlFunction: download

      attributes:                      # [REPEATABLE]

        # Nominal / categorical (text domain)
        - id: att-plotid
          name: plotID
          label: Plot Identifier
          definition: Unique integer identifier for each permanent plot (1–50).
          storageType: integer
          measurementScale:
            type: nominal
            domain:
              type: text
              definition: Unique plot codes
              pattern: "[0-9]{1,2}"
          missingValueCodes:
            - code: "-9999"
              explanation: Plot was not sampled in this year

        # DateTime
        - id: att-date
          name: sampleDate
          definition: Date of vegetation survey.
          storageType: date
          measurementScale:
            type: dateTime
            formatString: YYYY-MM-DD
            precision: 1 day
            domain:
              minimum:
                value: "2000-01-01"
                exclusive: false
              maximum:
                value: "2020-12-31"
                exclusive: false

        # Ratio (continuous numeric with true zero)
        - id: att-biomass
          name: aboveground_biomass
          label: Aboveground Biomass
          definition: Total estimated aboveground dry biomass per plot.
          storageType: float
          measurementScale:
            type: ratio
            unit:
              standard: gramsPerSquareMeter
              # For custom units use:
              # custom: gramsPerSquareMeterPerYear
            precision: 0.1
            domain:
              numberType: real           # natural | whole | integer | real
              minimum:
                value: 0
                exclusive: false
              maximum:
                value: 5000
                exclusive: false
          accuracy:
            report: Biomass estimated from allometric equations. RMSE = 12.4 g/m².
            quantitative:
              value: 12.4
              explanation: Root Mean Square Error from validation dataset.
          missingValueCodes:
            - code: NA
              explanation: Biomass not measured due to site disturbance
          annotation:                  # [OPTIONAL] Semantic annotation (EML 2.2.0+)
            propertyUri:
              value: http://purl.obolibrary.org/obo/IAO_0000136
              label: is about
            valueUri:
              value: http://purl.obolibrary.org/obo/ENVO_01001536
              label: plant biomass

        # Nominal / categorical (enumerated domain)
        - id: att-veg-class
          name: vegetationType
          definition: Dominant vegetation class of the plot.
          storageType: string
          measurementScale:
            type: nominal
            domain:
              type: enumerated
              codes:
                - code: OAK
                  definition: Oak woodland dominated by Quercus douglasii
                  source: Field classification guide v2
                - code: CHAP
                  definition: Chaparral shrubland
                - code: GRASS
                  definition: Annual grassland

        # Interval (numeric, no true zero — e.g. Celsius)
        - id: att-temp
          name: soil_temp_C
          definition: Soil temperature at 10 cm depth in degrees Celsius.
          storageType: float
          measurementScale:
            type: interval
            unit:
              standard: celsius
            precision: 0.01
            domain:
              numberType: real

      constraints:                     # [OPTIONAL][REPEATABLE]
        - type: primaryKey
          name: pk_plot_date
          keys: [plotID, sampleDate]
        - type: notNull
          name: nn_plotID
          keys: [plotID]

      numberOfRecords: 1050            # [OPTIONAL]


  # -- Spatial Raster --

  spatialRasters:                      # [OPTIONAL][REPEATABLE]
    - id: raster-dem
      entityName: dem_30m.tif
      entityDescription: Digital elevation model at 30 m resolution covering the study area.
      physical:
        objectName: dem_30m.tif
        dataFormat:
          externalFormat:
            name: GeoTIFF
            version: "1.0"
        distributions:
          - online:
              url: https://data.repository.org/package/dataset-001/dem_30m.tif
              urlFunction: download
      attributes:
        - name: elevation
          definition: Surface elevation above mean sea level.
          measurementScale:
            type: ratio
            unit:
              standard: meter
            domain:
              numberType: real
      spatialReference:
        name: GCS WGS 1984
        datum: D WGS 1984
        spheroid:
          name: WGS 1984
          semiAxisMajor: 6378137.0
          denomFlatRatio: 298.257223563
        primeMeridian:
          name: Greenwich
          longitude: 0.0
        unit: degree
      horizontalAccuracy: RMSE 5 m from USGS benchmark comparison.
      verticalAccuracy: RMSE 1.2 m vertical from USGS lidar reference.
      cellSize:
        x: 30
        y: 30
      numberOfBands: 1
      rasterOrigin: Upper Left
      rows: 1200
      columns: 900
      verticals: 1
      cellGeometry: pixel              # point | pixel


  # -- Spatial Vector --

  spatialVectors:                      # [OPTIONAL][REPEATABLE]
    - id: vector-plots
      entityName: study_plots.shp
      entityDescription: Shapefile of 50 permanent vegetation plots.
      physical:
        objectName: study_plots.zip
        dataFormat:
          externalFormat:
            name: ESRI Shapefile
        distributions:
          - online:
              url: https://data.repository.org/package/dataset-001/study_plots.zip
              urlFunction: download
      attributes:
        - name: plotID
          definition: Plot identifier matching plot_data.csv
          measurementScale:
            type: nominal
            domain:
              type: text
              definition: Unique plot identifier
      geometry: Point
      # Geometry types: Point | LineString | LinearRing | Polygon |
      #                 MultiPoint | MultiLineString | MultiPolygon | MultiGeometry
      geometricObjectCount: 50
      spatialReference:
        name: GCS WGS 1984
        datum: D WGS 1984


  # -- Other Entity (non-tabular, non-spatial files) --

  otherEntities:                       # [OPTIONAL][REPEATABLE]
    - id: entity-script
      entityName: analysis_script.R
      entityDescription: R script to reproduce all analyses and figures from the manuscript.
      physical:
        objectName: analysis_script.R
        size:
          value: 45678
          unit: bytes
        dataFormat:
          externalFormat:
            name: R script
            version: 4.3.0
        distributions:
          - online:
              url: https://data.repository.org/package/dataset-001/analysis_script.R
              urlFunction: download
      entityType: script


# -----------------------------------------------------------------------------
# ADDITIONAL METADATA — Custom extensions, unit definitions, provenance
# -----------------------------------------------------------------------------
additionalMetadata:                    # [OPTIONAL][REPEATABLE]
  - describes: dataset-001
    metadata:
      customUnits:
        - id: gramsPerSquareMeterPerYear
          name: gramsPerSquareMeterPerYear
          abbreviation: g/m²/yr
          parentSI: kilogramPerSquareMeter
          multiplierToSI: 0.001
          constantToSI: 0
          unitType: arealMassDensityRate
          description: Mass per unit area per year
      emlEditor:
        app: ezEML
        release: "2024.01.15"

  - describes: att-biomass
    metadata:
      fieldProtocol: allometric-equations-v2.pdf